<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool de Profesores — Megatlon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:       #ffffff;
  --surface:  #f5f5f5;
  --surface2: #ebebeb;
  --border:   #dedede;
  --black:    #000000;
  --charcoal: #2b2b2b;
  --mid:      #555555;
  --muted:    #888888;
  --dim:      #bbbbbb;
  --white:    #ffffff;
  --dark-bg:  #1a1a1a;
  --dark-surface: #252525;
  --dark-border:  #383838;
  --green:  #1a6e3c;
  --green-bg: #edf7f1;
  --red-bg: #fdf0f0;
  --red-text: #c0392b;
  --warn: #7d5a00;
  --warn-bg: #fdf6e3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--charcoal);
  font-family: 'Arial', 'Helvetica Neue', sans-serif;
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  background: var(--white);
  border-bottom: 2px solid var(--black);
  padding: 0 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-area { display: flex; align-items: center; gap: 14px; }
.logo-megatlon { display: flex; flex-direction: column; gap: 2px; }
.logo-brand {
  font-size: 24px; font-weight: 900;
  letter-spacing: -0.5px; color: var(--black);
  line-height: 1; font-family: 'Arial Black', 'Arial', sans-serif;
  text-transform: uppercase;
}
.logo-sub {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 3px;
  color: var(--muted);
}
.header-stats { display: flex; gap: 36px; align-items: center; }
.stat { text-align: center; }
.stat .num { font-size: 22px; font-weight: 900; color: var(--black); line-height: 1; }
.stat .lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
.sync-status {
  font-size: 9px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.5px; display: flex; align-items: center; gap: 5px;
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim); display: inline-block;
  transition: background 0.3s;
}
.sync-dot.ok  { background: #1a6e3c; }
.sync-dot.err { background: #c0392b; }
.sync-dot.loading { background: #f0c060; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── MAIN ─────────────────────────────────────────── */
.main { max-width: 1440px; margin: 0 auto; padding: 32px 28px; }

/* ── SECTION CARD ─────────────────────────────────── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  margin-bottom: 28px;
  overflow: hidden;
}
.card-head {
  padding: 15px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  font-size: 10px; font-weight: 900;
  text-transform: uppercase; letter-spacing: 3px;
  color: var(--black);
  display: flex; align-items: center; gap: 10px;
}
.card-title::before {
  content: '';
  display: block;
  width: 3px; height: 16px;
  background: var(--black);
  border-radius: 1px;
}
.card-body { padding: 24px; }

/* ── DARK CARD (reemplazo) ────────────────────────── */
.card-dark { background: var(--dark-bg); }
.card-dark .card-head {
  background: var(--black);
  border-bottom: 1px solid var(--dark-border);
}
.card-dark .card-title { color: var(--white); }
.card-dark .card-title::before { background: var(--white); }
.card-dark .card-body { background: var(--dark-bg); }

/* ── FILTROS ──────────────────────────────────────── */
.filter-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg label {
  font-size: 9px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
}
.fg select, .fg input[type="text"] {
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--charcoal);
  padding: 9px 11px; border-radius: 2px;
  font-size: 13px; width: 100%;
  transition: border-color 0.15s;
}
.fg select:focus, .fg input[type="text"]:focus {
  outline: none; border-color: var(--black);
}
/* dark variant */
.fg-dark label { color: var(--dim); }
.fg-dark select, .fg-dark input[type="text"] {
  background: var(--dark-surface);
  border-color: var(--dark-border);
  color: var(--white);
}
.fg-dark select option { background: #222; }
.fg-dark select:focus, .fg-dark input[type="text"]:focus { border-color: var(--white); }

/* ── DÍAS ────────────────────────────────────────── */
.days-row { display: flex; gap: 5px; flex-wrap: wrap; }
.day-btn {
  width: 34px; height: 34px; border-radius: 2px;
  border: 1px solid var(--dark-border); background: var(--dark-surface);
  color: var(--dim); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.day-btn.on { background: var(--white); border-color: var(--white); color: var(--black); }
.day-btn:hover:not(.on) { border-color: var(--white); color: var(--white); }

/* ── BUTTONS ─────────────────────────────────────── */
.btn {
  padding: 9px 20px; border-radius: 2px; border: none;
  font-size: 10px; font-weight: 900; text-transform: uppercase;
  letter-spacing: 1.5px; cursor: pointer;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
}
.btn-black { background: var(--black); color: var(--white); }
.btn-black:hover { background: var(--charcoal); }
.btn-white { background: var(--white); color: var(--black); border: 1px solid var(--white); }
.btn-white:hover { background: var(--surface); }
.btn-outline { background: transparent; color: var(--black); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--black); }
.btn-outline-dark { background: transparent; color: var(--white); border: 1px solid var(--dark-border); }
.btn-outline-dark:hover { border-color: var(--white); }
.btn-sm { padding: 5px 12px; font-size: 9px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── TABLE ───────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  background: var(--black);
  color: var(--white);
  padding: 10px 12px; text-align: left;
  font-size: 8px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--surface); }
tbody td { padding: 10px 12px; vertical-align: middle; }

/* ── BADGES ──────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 1px;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.b-sede { background: var(--black); color: var(--white); }
.b-mono { background: var(--warn-bg); color: var(--warn); border: 1px solid #e8d5a0; }
.b-rd   { background: var(--green-bg); color: var(--green); border: 1px solid #b7dfc8; }
.b-mañana { background: #fff8e1; color: #7d5a00; border: 1px solid #ffe082; }
.b-tarde  { background: #f3e5f5; color: #6a1b9a; border: 1px solid #ce93d8; }
.b-noche  { background: #e8eaf6; color: #283593; border: 1px solid #9fa8da; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 1px;
  font-size: 10px; color: var(--mid); margin: 2px;
}
.chip-rm {
  cursor: pointer; color: var(--muted); font-size: 11px;
  line-height: 1; padding: 0 2px;
}
.chip-rm:hover { color: var(--red-text); }

.tel-link { color: var(--black); text-decoration: none; font-weight: 700; white-space: nowrap; }
.tel-link:hover { color: var(--mid); }

/* ── RESULT CARDS ────────────────────────────────── */
.result-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
}
.rcard {
  background: var(--dark-surface); border: 1px solid var(--green);
  border-radius: 2px; padding: 18px;
}
.rcard .rname { font-size: 15px; font-weight: 900; color: var(--white); margin-bottom: 5px; }
.rcard .rinfo { font-size: 11px; color: var(--dim); margin: 3px 0; }
.rcard .rnote {
  font-size: 10px; background: #2a1f00; border: 1px solid #5c4200;
  border-radius: 2px; padding: 6px 8px; margin-top: 7px; color: #f0c060;
}
.rcard .rtel {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--white); color: var(--black);
  padding: 11px; border-radius: 2px; text-decoration: none;
  font-weight: 900; font-size: 13px; margin-top: 12px;
  text-transform: uppercase; letter-spacing: 1px;
  transition: background 0.15s;
}
.rcard .rtel:hover { background: var(--surface); }

.summary {
  background: var(--green-bg); border: 1px solid #b7dfc8;
  border-radius: 2px; padding: 10px 16px; margin-bottom: 16px;
  font-size: 12px; color: var(--green); font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
}
.err-box {
  text-align: center; padding: 28px; background: var(--dark-surface);
  border: 1px solid #a0232e; border-radius: 2px;
}
.no-results { text-align: center; padding: 48px; color: var(--muted); }
.pool-footer { margin-top: 10px; font-size: 11px; color: var(--muted); }

/* ── MODAL ───────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--white); border: 1px solid var(--border);
  border-top: 3px solid var(--black);
  width: 860px; max-width: 97vw;
  /* No overflow-y: auto — todo debe verse sin scroll */
  transform: translateY(14px); transition: transform 0.2s;
}
.overlay.open .modal { transform: translateY(0); }
.modal-head {
  padding: 14px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--white);
}
.modal-head h3 {
  font-size: 10px; font-weight: 900;
  text-transform: uppercase; letter-spacing: 3px; color: var(--black);
}
.modal-x {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
}
.modal-x:hover { color: var(--black); }
.modal-body { padding: 18px 22px; }
.modal-foot {
  padding: 12px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* Formulario en 3 columnas */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px 14px;
}
.fg2 { display: flex; flex-direction: column; gap: 4px; }
.fg2.col2 { grid-column: span 2; }
.fg2.full { grid-column: 1 / -1; }
.fg2 label {
  font-size: 9px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
}
.fg2 input, .fg2 select, .fg2 textarea {
  background: var(--white); border: 1px solid var(--border);
  color: var(--charcoal); padding: 7px 10px; border-radius: 2px;
  font-size: 12px; font-family: inherit; transition: border-color 0.15s;
}
.fg2 input:focus, .fg2 select:focus, .fg2 textarea:focus {
  outline: none; border-color: var(--black);
}
.fg2 textarea { resize: none; height: 52px; }

/* Técnicas multi-add */
.tech-add-row { display: flex; gap: 8px; margin-bottom: 6px; }
.tech-add-row select { flex: 1; }
.tech-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }

.icon-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 4px 9px; border-radius: 2px;
  font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.icon-btn:hover { border-color: var(--black); color: var(--black); background: var(--surface); }

/* divider */
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* loading overlay */
.loading-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: var(--black); z-index: 9999;
  animation: loadbar 0.8s ease-in-out infinite;
  display: none;
}
.loading-bar.show { display: block; }
@keyframes loadbar {
  0%  { transform: translateX(-100%); }
  100%{ transform: translateX(100%);  }
}

/* ── TABS ────────────────────────────────────────── */
.tab-nav {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  gap: 0;
}
.tab-btn {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 14px 22px 11px;
  font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
  color: var(--muted); cursor: pointer; transition: all 0.15s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--charcoal); }
.tab-btn.active { color: var(--black); border-bottom-color: var(--black); }

/* ── GESTIÓN CLASES ──────────────────────────────── */
.clases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}
.clase-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 2px; padding: 8px 12px;
  font-size: 12px; font-weight: 600; color: var(--charcoal);
}
.clase-del {
  background: none; border: none; color: var(--dim); font-size: 13px;
  cursor: pointer; padding: 0 4px; transition: color 0.15s; line-height: 1;
}
.clase-del:hover { color: var(--red-text); }
.nueva-clase-row {
  display: flex; gap: 10px; align-items: center; margin-bottom: 20px;
}
.nueva-clase-row input {
  flex: 1; background: var(--white); border: 1px solid var(--border);
  color: var(--charcoal); padding: 9px 12px; border-radius: 2px;
  font-size: 13px; font-family: inherit; max-width: 340px;
}
.nueva-clase-row input:focus { outline: none; border-color: var(--black); }

@media (max-width: 768px) {
  .header { padding: 0 16px; }
  .header-stats { gap: 16px; }
  .stat .num { font-size: 18px; }
  .main { padding: 16px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .fg2.col2 { grid-column: 1 / -1; }
  .tab-nav { padding: 0 16px; }
}
</style>
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>

<!-- HEADER -->
<div class="header">
  <div class="logo-area">
    <div class="logo-megatlon">
      <div class="logo-brand">MEGATLON</div>
      <div class="logo-sub">Pool de Profesores</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="num" id="s-prof">—</div><div class="lbl">Profesores</div></div>
    <div class="stat"><div class="num" id="s-tech">—</div><div class="lbl">Técnicas</div></div>
    <div class="stat"><div class="num">29</div><div class="lbl">Sedes</div></div>
    <div class="sync-status">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-lbl">Conectando…</span>
    </div>
  </div>
</div>

<!-- TAB NAV -->
<div class="tab-nav">
  <button class="tab-btn active" id="tab-btn-pool" onclick="switchTab('pool')">Pool de Profesores</button>
  <button class="tab-btn" id="tab-btn-clases" onclick="switchTab('clases')">Gestión de Clases</button>
</div>

<div class="main">

  <!-- ═══ TAB POOL ════════════════════════════════════════ -->
  <div id="tab-pool">

  <!-- ── BUSCAR REEMPLAZO ───────────────────────────────── -->
  <div class="card card-dark">
    <div class="card-head">
      <div class="card-title" style="color:var(--white);">⚡ Buscar Reemplazo Rápido</div>
      <span style="font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;">Encontrá cobertura en segundos</span>
    </div>
    <div class="card-body">
      <div class="filter-row">
        <div class="fg fg-dark">
          <label>Técnica necesaria</label>
          <select id="r-tech"><option value="">— Todas —</option></select>
        </div>
        <div class="fg fg-dark">
          <label>Franja horaria</label>
          <select id="r-franja">
            <option value="">— Cualquier franja —</option>
            <option>Mañana</option><option>Tarde</option><option>Noche</option>
          </select>
        </div>
        <div class="fg fg-dark">
          <label>Sede a cubrir</label>
          <select id="r-sede"><option value="">— Cualquier sede —</option></select>
        </div>
        <div class="fg fg-dark">
          <label>Días &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0;">(X = Miércoles)</span></label>
          <div class="days-row">
            <div class="day-btn" data-d="L" onclick="toggleDay(this)">L</div>
            <div class="day-btn" data-d="M" onclick="toggleDay(this)">M</div>
            <div class="day-btn" data-d="X" onclick="toggleDay(this)">X</div>
            <div class="day-btn" data-d="J" onclick="toggleDay(this)">J</div>
            <div class="day-btn" data-d="V" onclick="toggleDay(this)">V</div>
            <div class="day-btn" data-d="S" onclick="toggleDay(this)">S</div>
            <div class="day-btn" data-d="D" onclick="toggleDay(this)">D</div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-white" onclick="buscarReemplazo()">⚡ Buscar Reemplazo</button>
        <button class="btn btn-outline-dark" onclick="clearSearch()">✕ Limpiar</button>
      </div>
      <div id="r-results" style="margin-top:20px;display:none;"></div>
    </div>
  </div>

  <!-- ── POOL COMPLETO ──────────────────────────────────── -->
  <div class="card">
    <div class="card-head">
      <div class="card-title">Pool de Profesores</div>
      <button class="btn btn-black" onclick="openModal()">+ Agregar Profesor</button>
    </div>
    <div class="card-body">
      <div class="filter-row" style="margin-bottom:14px;">
        <div class="fg">
          <label>Buscar</label>
          <input type="text" id="p-search" placeholder="Nombre o técnica..." oninput="renderPool()">
        </div>
        <div class="fg">
          <label>Sede titular</label>
          <select id="p-sede" onchange="renderPool()"><option value="">— Todas —</option></select>
        </div>
        <div class="fg">
          <label>Técnica</label>
          <select id="p-tech" onchange="renderPool()"><option value="">— Todas —</option></select>
        </div>
        <div class="fg">
          <label>Franja</label>
          <select id="p-franja" onchange="renderPool()">
            <option value="">— Todas —</option>
            <option>Mañana</option><option>Tarde</option><option>Noche</option>
          </select>
        </div>
        <div class="fg">
          <label>Tipo</label>
          <select id="p-tipo" onchange="renderPool()">
            <option value="">— Todos —</option>
            <option value="RD">RD</option><option value="Mono">Mono</option>
          </select>
        </div>
        <div class="fg" style="justify-content:flex-end;padding-top:18px;">
          <button class="btn btn-outline btn-sm" onclick="clearPool()">✕ Limpiar</button>
        </div>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Sede</th><th>Nombre</th><th>Teléfono</th><th>Técnicas</th>
              <th>Franja</th><th>Horario</th><th>Días</th>
              <th>Zona</th><th>Puede cubrir</th><th>Tipo</th><th>Notas</th><th></th>
            </tr>
          </thead>
          <tbody id="pool-tbody"></tbody>
        </table>
      </div>
      <div id="pool-empty" class="no-results" style="display:none;"></div>
      <div class="pool-footer" id="pool-count"></div>
    </div>
  </div>

  </div><!-- /tab-pool -->

  <!-- ═══ TAB CLASES ═══════════════════════════════════════ -->
  <div id="tab-clases" style="display:none;">
    <div class="card">
      <div class="card-head">
        <div class="card-title">Clases Disponibles</div>
        <span style="font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;" id="clases-count"></span>
      </div>
      <div class="card-body">
        <div class="nueva-clase-row">
          <input type="text" id="nueva-clase-input" placeholder="Nueva clase (Ej: Hyrox, CrossFit...)"
            onkeydown="if(event.key==='Enter') agregarClase()">
          <button class="btn btn-black btn-sm" onclick="agregarClase()">+ Agregar Clase</button>
        </div>
        <div class="clases-grid" id="clases-grid"></div>
      </div>
    </div>
  </div>

</div>

<!-- ── MODAL ──────────────────────────────────────────────── -->
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-ttl">Agregar Profesor</h3>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">

        <!-- Fila 1: Sede | Nombre | Teléfono -->
        <div class="fg2">
          <label>Sede titular *</label>

/* ═══════════════════════════════ HELPERS ════════════════════════════ */
function setLoading(on) {
  document.getElementById('loading-bar').classList.toggle('show', on);
}

function setSyncStatus(state, msg) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-lbl');
  dot.className = 'sync-dot ' + state;
  lbl.textContent = msg;
}

function addOpt(sel, val) {
  const o = document.createElement('option');
  o.value = o.textContent = val;
  sel.appendChild(o);
}

function parseDias(str) {
  if (!str) return [];
  const arr = []; let ms = 0;
  str.toUpperCase().split(/[-\s,]+/).forEach(p => {
    if (p === 'M')       { ms++; arr.push(ms === 1 ? 'M' : 'X'); }
    else if (['X','MI','MIÉ'].includes(p))         arr.push('X');
    else if (['L','J','V','S','D'].includes(p))     arr.push(p);
    else if (['SABADO','SÁBADO'].includes(p))        arr.push('S');
    else if (p === 'DOMINGO')  arr.push('D');
    else if (p === 'LUNES')    arr.push('L');
    else if (p === 'MARTES')   arr.push('M');
    else if (p === 'JUEVES')   arr.push('J');
    else if (p === 'VIERNES')  arr.push('V');
  });
  return [...new Set(arr)];
}

/* ═══════════════════════════════ SUPABASE CRUD ══════════════════════ */
async function loadData() {
  setLoading(true);
  setSyncStatus('loading', 'Cargando…');
  const { data, error } = await sb
    .from('profesores')
    .select('*')
    .order('nombre', { ascending: true });
  setLoading(false);
  if (error) {
    console.error(error);
    setSyncStatus('err', 'Error de conexión');
    return;
  }
  poolData = data || [];
  setSyncStatus('ok', 'Sincronizado');
  updateStats();
  renderPool();
}

async function insertProf(row) {
  const { data, error } = await sb.from('profesores').insert(row).select().single();
  if (error) throw error;
  return data;
}

async function updateProf(id, row) {
  const { data, error } = await sb.from('profesores').update(row).eq('id', id).select().single();
  if (error) throw error;
  return data;
}

async function deleteProf(id) {
  const { error } = await sb.from('profesores').delete().eq('id', id);
  if (error) throw error;
}

/* ════════════════ CRUD TÉCNICAS ════════════════════ */
async function loadTecnicas() {
  const { data, error } = await sb.from('tecnicas').select('*').order('nombre', { ascending: true });
  if (error) { console.error(error); return; }

  // Si la tabla está vacía, la sembramos con los defaults
  if (!data || data.length === 0) {
    const rows = TECNICAS_DEFAULT.map(n => ({ nombre: n }));
    const { data: seeded, error: seedErr } = await sb.from('tecnicas').insert(rows).select();
    if (seedErr) { console.error(seedErr); return; }
    tecnicasData = (seeded || []).sort((a,b) => a.nombre.localeCompare(b.nombre));
  } else {
    tecnicasData = data;
  }
  TECNICAS = tecnicasData.map(t => t.nombre);
}

async function insertTecnica(nombre) {
  const { data, error } = await sb.from('tecnicas').insert({ nombre }).select().single();
  if (error) throw error;
  return data;
}

async function deleteTecnicaDB(id) {
  const { error } = await sb.from('tecnicas').delete().eq('id', id);

/* ═══════════════════════════════ INIT ═══════════════════════════════ */
function populateTechSelects() {
  ['r-tech','p-tech','f-tech-pick'].forEach(id => {
    const s = document.getElementById(id);
    const first = s.options[0]; s.innerHTML = ''; s.appendChild(first);

/* ═══════════════════════════════ POOL ═══════════════════════════════ */
function renderPool() {
  const search  = document.getElementById('p-search').value.toLowerCase();
  const fSede   = document.getElementById('p-sede').value;
  const fTech   = document.getElementById('p-tech').value;
  const fFranja = document.getElementById('p-franja').value;
  const fTipo   = document.getElementById('p-tipo').value;

  let rows = poolData.filter(r => {
    const tecnicas = Array.isArray(r.tecnicas) ? r.tecnicas : [];
    if (fSede   && r.sede    !== fSede)   return false;
    if (fFranja && r.franja  !== fFranja) return false;
    if (fTipo   && r.tipo    !== fTipo)   return false;
    if (fTech   && !tecnicas.map(t=>t.toLowerCase()).includes(fTech.toLowerCase())) return false;
    if (search  && !r.nombre.toLowerCase().includes(search)
                && !tecnicas.some(t => t.toLowerCase().includes(search))) return false;
    return true;
  });

  const tbody = document.getElementById('pool-tbody');
  const empty = document.getElementById('pool-empty');
  const count = document.getElementById('pool-count');

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    const hayDatos = poolData.length > 0;
    empty.innerHTML = hayDatos
      ? `<div style="font-size:26px;margin-bottom:10px;">🔍</div>
         <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Sin resultados</div>
         <div style="font-size:12px;color:var(--muted);margin-top:4px;">Probá con otros filtros</div>`
      : `<div style="font-size:36px;margin-bottom:14px;">🏋️</div>
         <div style="font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;">El pool está vacío</div>
         <div style="font-size:12px;color:var(--muted);margin-bottom:20px;">Agregá el primer profesor para comenzar</div>
         <button class="btn btn-black" onclick="openModal()">+ Agregar Primer Profesor</button>`;
    count.textContent = '';
    return;
  }

  empty.style.display = 'none';
  count.textContent = `${rows.length} profesor${rows.length > 1 ? 'es' : ''} encontrado${rows.length > 1 ? 's' : ''}`;

  tbody.innerHTML = rows.map(r => {
    const tecnicas = Array.isArray(r.tecnicas) ? r.tecnicas : [];
    const fb = r.franja ? `b-${r.franja.toLowerCase()}` : '';
    return `<tr>
      <td><span class="badge b-sede">${r.sede}</span></td>
      <td style="font-weight:700;white-space:nowrap;">${r.nombre}</td>
      <td><a href="tel:${r.tel||''}" class="tel-link">📞 ${r.tel||'—'}</a></td>
      <td>${tecnicas.map(t => `<span class="chip">${t}</span>`).join('')}</td>
      <td><span class="badge ${fb}">${r.franja||'—'}</span></td>
      <td style="color:var(--muted);font-size:11px;white-space:nowrap;">${r.horario||'—'}</td>
      <td style="font-weight:700;font-size:11px;white-space:nowrap;">${r.dias||'—'}</td>
      <td style="font-size:10px;color:var(--muted);max-width:150px;">${r.zona||'—'}</td>
      <td style="font-size:11px;">${r.cubre||'—'}</td>
      <td>${r.tipo ? `<span class="badge b-${r.tipo.toLowerCase()}">${r.tipo}</span>` : '—'}</td>
      <td style="font-size:10px;color:var(--muted);max-width:140px;" title="${r.notas||''}">${r.notas ? r.notas.slice(0,44)+(r.notas.length>44?'…':'') : '—'}</td>
      <td style="white-space:nowrap;">
        <button class="icon-btn" onclick="editProf('${r.id}')" title="Editar" style="margin-right:3px;">✏️</button>
        <button class="icon-btn" onclick="delProf('${r.id}','${r.nombre.replace(/'/g,"\\'")}')" title="Eliminar">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

/* ═══════════════════════ REPLACEMENT ════════════════════════════ */
function toggleDay(el) {
  const d = el.dataset.d;
  el.classList.toggle('on');
  el.classList.contains('on') ? selDays.add(d) : selDays.delete(d);
}

function buscarReemplazo() {
  const tech   = document.getElementById('r-tech').value;
  const franja = document.getElementById('r-franja').value;
  const sede   = document.getElementById('r-sede').value;

  let results = poolData.filter(r => {
    const tecnicas = Array.isArray(r.tecnicas) ? r.tecnicas : [];
    const da       = Array.isArray(r.da) ? r.da : [];
    if (tech   && !tecnicas.map(t=>t.toLowerCase()).includes(tech.toLowerCase())) return false;
    if (franja && r.franja !== franja) return false;
    if (sede   && !(r.cubre||'').toLowerCase().includes(sede.toLowerCase())) return false;
    if (selDays.size > 0) {
      for (let d of selDays) { if (!da.includes(d)) return false; }
    }
    return true;
  });

  const cont = document.getElementById('r-results');
  cont.style.display = 'block';

  if (!results.length) {
    cont.innerHTML = `<div class="err-box">
      <div style="font-size:28px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:900;color:var(--white);font-size:13px;text-transform:uppercase;letter-spacing:2px;">Sin profesores disponibles</div>
      <div style="font-size:11px;color:var(--dim);margin-top:5px;">Intentá ampliar los filtros</div>
    </div>`;
    return;
  }

  cont.innerHTML = `
    <div class="summary">✅ ${results.length} profesor${results.length>1?'es':''} disponible${results.length>1?'s':''}</div>
    <div class="result-grid">${results.map(r => {
      const tecnicas = Array.isArray(r.tecnicas) ? r.tecnicas : [];
      return `<div class="rcard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div class="rname">${r.nombre}</div>
          <span class="badge b-sede">${r.sede}</span>
        </div>
        <div style="margin-bottom:7px;">${tecnicas.map(t=>`<span class="chip" style="background:#333;border-color:#444;color:#ccc;">${t}</span>`).join('')}</div>
        <div class="rinfo">🕐 ${r.franja||'—'} · ${r.horario||'—'} · <strong style="color:var(--white);">${r.dias||'—'}</strong></div>
        <div class="rinfo">📍 ${r.cubre||'—'}</div>
        ${r.notas ? `<div class="rnote">💡 ${r.notas}</div>` : ''}
        ${r.tipo  ? `<div style="margin-top:7px;"><span class="badge b-${r.tipo.toLowerCase()}">${r.tipo}</span></div>` : ''}
        <a href="tel:${r.tel||''}" class="rtel">📞 ${r.tel||'Sin teléfono'}</a>
      </div>`;
    }).join('')}
    </div>`;
}

function clearSearch() {
  ['r-tech','r-franja','r-sede'].forEach(id => document.getElementById(id).value = '');

  selDays.clear();
  document.getElementById('r-results').style.display = 'none';
}

function clearPool() {
  ['p-search','p-sede','p-tech','p-franja','p-tipo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';

}

/* ═══════════════════════════════ MODAL ══════════════════════════════ */
function openModal(id = null) {
  editId = id;
  document.getElementById('modal-ttl').textContent = id ? 'Editar Profesor' : 'Agregar Profesor';
  formTecnicas = [];

  if (id) {
    const r = poolData.find(x => x.id === id);
    if (r) {
      document.getElementById('f-sede').value    = r.sede    || '';
      document.getElementById('f-nombre').value  = r.nombre  || '';
      document.getElementById('f-tel').value     = r.tel     || '';
      document.getElementById('f-tipo').value    = r.tipo    || '';
      document.getElementById('f-franja').value  = r.franja  || '';
      document.getElementById('f-horario').value = r.horario || '';
      document.getElementById('f-dias').value    = r.dias    || '';
      document.getElementById('f-zona').value    = r.zona    || '';
      document.getElementById('f-cubre').value   = r.cubre   || '';
      document.getElementById('f-notas').value   = r.notas   || '';
      formTecnicas = [...(Array.isArray(r.tecnicas) ? r.tecnicas : [])];
    }
  } else {
    ['f-sede','f-nombre','f-tel','f-tipo','f-franja','f-horario','f-dias','f-zona','f-cubre','f-notas']
      .forEach(fid => { document.getElementById(fid).value = ''; });
  }
  renderTechChips();
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editId = null;
}

function bgClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

async function saveProf() {
  const sede   = document.getElementById('f-sede').value;
  const nombre = document.getElementById('f-nombre').value.trim();
  const dias   = document.getElementById('f-dias').value.trim();

  if (!sede || !nombre) {
    alert('Completá los campos obligatorios: Sede y Nombre.');
    return;
  }
  if (!formTecnicas.length) {
    alert('Agregá al menos una técnica.');
    return;
  }

  const row = {
    sede,
    nombre,
    tel:      document.getElementById('f-tel').value.trim(),
    tecnicas: [...formTecnicas],
    franja:   document.getElementById('f-franja').value,
    horario:  document.getElementById('f-horario').value.trim(),
    dias,
    da:       parseDias(dias),
    zona:     document.getElementById('f-zona').value,
    cubre:    document.getElementById('f-cubre').value.trim(),
    tipo:     document.getElementById('f-tipo').value,
    notas:    document.getElementById('f-notas').value.trim(),
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  setLoading(true);
  setSyncStatus('loading', 'Guardando…');

  try {
    if (editId) {
      const updated = await updateProf(editId, row);
      const idx = poolData.findIndex(x => x.id === editId);
      if (idx >= 0) poolData[idx] = updated;
    } else {
      const created = await insertProf(row);
      poolData.push(created);
    }
    setSyncStatus('ok', 'Sincronizado');
    closeModal();
    updateStats();
    renderPool();
  } catch(err) {
    console.error(err);
    setSyncStatus('err', 'Error al guardar');
    alert('No se pudo guardar. Revisá la conexión.');
  } finally {
    setLoading(false);
    btn.disabled = false;
    btn.textContent = 'Guardar Profesor';
  }
}

function editProf(id) { openModal(id); }

async function delProf(id, nombre) {
  if (!confirm(`¿Eliminar a ${nombre}?`)) return;
  setLoading(true);
  setSyncStatus('loading', 'Eliminando…');
  try {
    await deleteProf(id);
    poolData = poolData.filter(x => x.id !== id);
    setSyncStatus('ok', 'Sincronizado');
    updateStats();
    renderPool();
  } catch(err) {
    console.error(err);
    setSyncStatus('err', 'Error al eliminar');
    alert('No se pudo eliminar. Revisá la conexión.');
  } finally {
    setLoading(false);
  }
}

/* ════════════════ TAB SWITCH ════════════════════════ */
function switchTab(tab) {
  document.getElementById('tab-pool').style.display   = tab === 'pool'   ? '' : 'none';
  document.getElementById('tab-clases').style.display = tab === 'clases' ? '' : 'none';
  document.getElementById('tab-btn-pool').classList.toggle('active',   tab === 'pool');
  document.getElementById('tab-btn-clases').classList.toggle('active', tab === 'clases');
  if (tab === 'clases') renderClasesTab();
}

function renderClasesTab() {
  const grid  = document.getElementById('clases-grid');
  const count = document.getElementById('clases-count');
  count.textContent = `${tecnicasData.length} clase${tecnicasData.length !== 1 ? 's' : ''}`;
  grid.innerHTML = tecnicasData.map(t =>
    `<div class="clase-item">
      <span>${t.nombre}</span>
      <button class="clase-del" onclick="eliminarClase('${t.id}','${t.nombre.replace(/'/g,"\\'")}') " title="Eliminar">✕</button>
    </div>`
  ).join('');
}

async function agregarClase() {
  const input  = document.getElementById('nueva-clase-input');
  const nombre = input.value.trim();
  if (!nombre) return;
  if (tecnicasData.some(t => t.nombre.toLowerCase() === nombre.toLowerCase())) {
    alert('Esa clase ya existe.');
    return;
  }
  setLoading(true);
  setSyncStatus('loading', 'Guardando…');
  try {
    const nueva = await insertTecnica(nombre);
    tecnicasData.push(nueva);
    tecnicasData.sort((a,b) => a.nombre.localeCompare(b.nombre));
    TECNICAS = tecnicasData.map(t => t.nombre);
    populateTechSelects();
    input.value = '';
    renderClasesTab();
    setSyncStatus('ok', 'Sincronizado');
  } catch(err) {
    console.error(err);
    setSyncStatus('err', 'Error al guardar');
    alert('No se pudo agregar la clase.');
  } finally {
    setLoading(false);
  }
}

async function eliminarClase(id, nombre) {
  if (!confirm(`¿Eliminar la clase "${nombre}"?`)) return;
  setLoading(true);
  setSyncStatus('loading', 'Eliminando…');
  try {
    await deleteTecnicaDB(id);
    tecnicasData = tecnicasData.filter(t => t.id !== id);
    TECNICAS = tecnicasData.map(t => t.nombre);
    populateTechSelects();
    renderClasesTab();
    setSyncStatus('ok', 'Sincronizado');
  } catch(err) {
    console.error(err);
    setSyncStatus('err', 'Error al eliminar');
    alert('No se pudo eliminar la clase.');
  } finally {
    setLoading(false);
  }
}

/* ── START ── */
init();
</script>
